<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>falls1r | CEO & Developer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ТУТ ТВОЙ ФОН */
            background: url('bg.png') no-repeat center center/cover;
            background-color: #0f0c29; /* Запасной цвет, если фон не загрузится */
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Затемнение фона, чтобы текст читался (если фон слишком яркий) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 0;
        }

        /* Свечение на фоне */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.5;
            animation: float 6s infinite alternate;
        }
        .glow-2 {
            background: #2563eb;
            right: 20%;
            top: 20%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Стеклянная карточка */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Аватарка с анимацией */
        .avatar-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            position: relative;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a1a1a;
            border: 3px solid #161b22;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(to right, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .status {
            font-size: 14px;
            color: #e5e7eb; /* Сделал чуть светлее для читаемости на фоне */
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .status span {
            display: inline-block;
            margin: 2px 0;
        }

        /* Кнопки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .links a.discord { background: rgba(88, 101, 242, 0.2); border-color: rgba(88, 101, 242, 0.4); }
        .links a.discord:hover { background: rgba(88, 101, 242, 0.4); }
        
        .links a.github { background: rgba(255, 255, 255, 0.1); }
        .links a.github:hover { background: rgba(255, 255, 255, 0.2); }

    </style>
</head>
